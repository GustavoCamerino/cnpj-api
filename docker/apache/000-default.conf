# Site padrão do Apache dentro do container.
#
# DocumentRoot aponta para public/. Só essa pasta fica exposta para a web, e o
# restante do projeto (.env, código, vendor) não pode ser acessado pelo navegador.
# AllowOverride All permite que o public/.htaccess do Laravel redirecione todas as
# URLs para o index.php (o "front controller").
<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Na imagem oficial, esses arquivos de log apontam para a saída do container
    # e aparecem no "docker compose logs app".
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
